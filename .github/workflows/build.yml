name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Monta uma pasta de publicação contendo APENAS os arquivos que o site
      # estático carrega. Evita expor dados sensíveis (ex.: backend/data/*.sqlite,
      # Dados/, Planilhas/, memoria/). A estrutura de diretórios é preservada
      # porque data-service.js resolve os JSON via import.meta.url (../../frontend/...).
      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site/frontend _site/backend/services
          cp index.html _site/index.html
          cp -r frontend/. _site/frontend/
          cp backend/services/data-service.js _site/backend/services/data-service.js
          cp backend/services/analytics.js _site/backend/services/analytics.js
          # Garante que nenhum banco de dados foi copiado por engano.
          if find _site -name '*.sqlite*' | grep -q .; then
            echo "ERRO: arquivo .sqlite encontrado no artefato de publicação" >&2
            exit 1
          fi

      # Publica somente o conteúdo de _site em uma branch gerada. A origem do
      # Pages deve permanecer configurada como gh-pages /(root).
      - name: Publish safe site to gh-pages branch
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          git -C _site init
          git -C _site config user.name "github-actions[bot]"
          git -C _site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _site add --all
          git -C _site commit -m "chore(pages): publish ${GITHUB_SHA}"
          git -C _site branch -M gh-pages

          # Reutiliza a credencial efêmera configurada por actions/checkout,
          # sem imprimir nem persistir token no conteúdo publicado.
          git config --local --get-regexp '^http\..*\.extraheader$' |
          while read -r key value; do
            git -C _site config "$key" "$value"
          done
          git -C _site remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C _site push --force origin gh-pages
