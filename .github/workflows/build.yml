name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Monta uma pasta de publicação contendo APENAS os arquivos que o site
      # estático carrega. Evita expor dados sensíveis (ex.: backend/data/*.sqlite,
      # Dados/, Planilhas/, memoria/). A estrutura de diretórios é preservada
      # porque data-service.js resolve os JSON via import.meta.url (../../frontend/...).
      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site/frontend _site/backend/services
          cp index.html _site/index.html
          cp -r frontend/. _site/frontend/
          cp backend/services/data-service.js _site/backend/services/data-service.js
          cp backend/services/analytics.js _site/backend/services/analytics.js
          # Garante que nenhum banco de dados foi copiado por engano.
          if find _site -name '*.sqlite*' | grep -q .; then
            echo "ERRO: arquivo .sqlite encontrado no artefato de publicação" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 65

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # actions/deploy-pages cancela o deployment após o limite interno de
      # 10 minutos. A API oficial é usada diretamente para preservar uma
      # publicação válida durante períodos excepcionais de fila do Pages.
      - name: Create and monitor Pages deployment
        id: deployment
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              core.setFailed(`Invalid Pages artifact ID: ${process.env.ARTIFACT_ID}`);
              return;
            }

            const idToken = await core.getIDToken();
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: idToken
              }
            );

            const pageUrl = deployment.page_url ||
              `https://${context.repo.owner}.github.io/${context.repo.repo}/`;
            core.setOutput('page_url', pageUrl);

            const deploymentId = deployment.id ??
              deployment.status_url?.split('/').filter(Boolean).pop() ??
              context.sha;
            const finalErrors = new Set([
              'deployment_failed',
              'deployment_content_failed',
              'deployment_cancelled',
              'deployment_lost'
            ]);
            const deadline = Date.now() + 60 * 60 * 1000;

            while (Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 10000));
              const { data: current } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deploymentId
                }
              );
              core.info(`Pages deployment status: ${current.status}`);

              if (current.status === 'succeed') {
                return;
              }
              if (finalErrors.has(current.status)) {
                core.setFailed(`Pages deployment ended with status: ${current.status}`);
                return;
              }
            }

            core.setFailed(
              'Pages deployment did not complete within 60 minutes; ' +
              'it was left active for GitHub to finish.'
            );
